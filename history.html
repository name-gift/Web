<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >

    <meta
        name="description"
        content="Lịch sử xem phim - MonFansub Vietnam."
    >

    <title>Lịch sử - MonFansub Vietnam</title>


    <!-- FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- CSS CHUNG -->

    <link rel="stylesheet" href="css/preloader.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/header.css">

    <link rel="stylesheet" href="css/account.css">

    <link rel="stylesheet" href="css/auth.css">

    <link rel="stylesheet" href="css/responsive.css">

    <!-- CSS RIÊNG -->

    <link rel="stylesheet" href="css/library.css">

</head>


<body>

    <!-- =====================================================
     PRELOADER
    ====================================================== -->

<div id="preloader">

    <div class="loader">

        <img
            class="loader-logo"
            src="https://i.imgur.com/nFJ3B1e.png"
            alt="MonFansub"
        >

        <div class="loader-spinner"></div>

        <div class="loader-text">
            Đang tải MonFansub...
        </div>

    </div>

</div>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
        class="header"
        id="header"
    >

        <div class="header-inner">


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
            >

                <img
                    src="https://i.imgur.com/nFJ3B1e.png"
                    alt="MonFansub"
                >

                <div class="logo-text">

                    MonFansub

                    <span>
                        Vietnam
                    </span>

                </div>

            </a>


            <!-- NAV -->

            <nav
                class="nav"
                id="mainNav"
            >

                <a href="index.html">
                    Trang chủ
                </a>

                <a href="index.html#latest">
                    Mới cập nhật
                </a>

                <a href="index.html#featured">
                    Nổi bật
                </a>

                <a href="index.html#categories">
                    Thể loại
                </a>

                <a
                    href="history.html"
                    class="active"
                >
                    Lịch sử
                </a>

                <a href="favorite.html">
                    Yêu thích
                </a>

            </nav>


            <!-- SEARCH -->

            <div class="header-search">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    id="searchInput"
                    type="search"
                    autocomplete="off"
                    placeholder="Tìm kiếm phim..."
                >

            </div>


            <!-- ACCOUNT -->

            <div
                class="account-area"
                id="accountArea"
            >

                <button
                    class="login-button"
                    id="loginButton"
                    type="button"
                    aria-label="Đăng nhập"
                    title="Đăng nhập"
                >

                    <i class="fa-solid fa-user"></i>

                </button>


                <button
                    class="user-button"
                    id="userButton"
                    type="button"
                    style="display:none"
                    aria-label="Tài khoản"
                    title="Tài khoản"
                >

                    <span class="user-avatar">

                        <i class="fa-solid fa-user"></i>

                    </span>

                </button>


                <div
                    class="user-dropdown"
                    id="userDropdown"
                >

                    <div class="dropdown-user">

                        <div class="dropdown-avatar">

                            <i class="fa-solid fa-user"></i>

                        </div>

                        <div class="dropdown-user-info">

                            <strong id="dropdownUserName">
                                User
                            </strong>

                            <small id="dropdownUserEmail">
                                user@email.com
                            </small>

                        </div>

                    </div>


                    <div class="dropdown-account-id">

                        <i class="fa-regular fa-address-card"></i>

                        <span>
                            ID tài khoản:
                        </span>

                        <strong id="dropdownUserId">
                            —
                        </strong>

                    </div>


                    <a
                        href="profile.html"
                        class="dropdown-item"
                        data-profile-link
                    >

                        <i class="fa-regular fa-user"></i>

                        <span>
                            Trang cá nhân
                        </span>

                    </a>


                    <a
                        href="settings.html"
                        class="dropdown-item"
                    >

                        <i class="fa-solid fa-gear"></i>

                        <span>
                            Cài đặt
                        </span>

                    </a>


                    <div class="dropdown-line"></div>


                    <button
                        id="logoutButton"
                        class="dropdown-item logout-button"
                        type="button"
                    >

                        <i class="fa-solid fa-right-from-bracket"></i>

                        <span>
                            Đăng xuất
                        </span>

                    </button>

                </div>

            </div>


            <!-- MOBILE -->

            <button
                class="mobile-menu"
                id="mobileMenu"
                type="button"
                aria-label="Menu"
            >

                <i class="fa-solid fa-bars"></i>

            </button>

        </div>

    </header>



    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <main class="library-page">

        <div class="library-container">


            <div class="library-header">

                <div>

                    <div class="library-title-row">

                        <i class="fa-regular fa-clock"></i>

                        <h1>
                            Lịch sử xem
                        </h1>

                    </div>

                    <p>
                        Những bộ phim bạn đã xem gần đây.
                    </p>

                </div>


                <button
                    type="button"
                    class="library-clear-button"
                    id="clearHistoryButton"
                >

                    <i class="fa-solid fa-trash"></i>

                    Xóa lịch sử

                </button>

            </div>


            <div
                class="library-grid"
                id="historyGrid"
            ></div>


            <div
                class="library-empty"
                id="historyEmpty"
                style="display:none"
            >

                <div class="library-empty-icon">

                    <i class="fa-regular fa-clock"></i>

                </div>

                <h2>
                    Chưa có lịch sử xem
                </h2>

                <p>
                    Những bộ phim bạn xem sẽ xuất hiện tại đây.
                </p>

                <a
                    href="index.html"
                    class="library-empty-button"
                >

                    <i class="fa-solid fa-film"></i>

                    Khám phá phim

                </a>

            </div>

        </div>

    </main>



    <!-- JAVASCRIPT -->

    <script src="js/app.js"></script>
    
    <script src="js/auth.js"></script>

    <script src="js/account-menu.js"></script>

    <script src="js/avatar.js"></script>

    <script src="js/library.js"></script>


</body>

</html>
