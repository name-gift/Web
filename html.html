<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test đăng nhập Google - Mon Fansub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #f5f5f5;
        }

        #user-info {
            margin-top: 25px;
            display: none;
        }

        #user-info img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
        }

        #logout {
            background: #f44336;
            color: white;
            border: none;
        }

        #status {
            margin-top: 15px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>monfansub</h1>

    <p>Test đăng nhập Google</p>

    <button id="google-login">
        🔵 Đăng nhập bằng Google
    </button>

    <div id="status"></div>

    <div id="user-info">
        <img id="avatar" src="" alt="Avatar">

        <h3 id="name"></h3>

        <p id="email"></p>

        <button id="logout">
            Đăng xuất
        </button>
    </div>

</div>


<script type="module">

    // ==============================
    // FIREBASE
    // ==============================

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // ==============================
    // FIREBASE CONFIG
    // ==============================

    const firebaseConfig = {

        apiKey: "AIzaSyDGhNlK7weHpHbj2-3cbOEl1NcwOzgR8OQ",

        authDomain: "monfantest.firebaseapp.com",

        projectId: "monfantest",

        storageBucket: "monfantest.firebasestorage.app",

        messagingSenderId: "225715511079",

        appId: "1:225715511079:web:b2ff0ef0fbef8cebeed302",

        measurementId: "G-W2XBLLD5LC"

    };


    // ==============================
    // KHỞI TẠO FIREBASE
    // ==============================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    // ==============================
    // HTML ELEMENTS
    // ==============================

    const loginButton =
        document.getElementById("google-login");

    const logoutButton =
        document.getElementById("logout");

    const status =
        document.getElementById("status");

    const userInfo =
        document.getElementById("user-info");

    const avatar =
        document.getElementById("avatar");

    const name =
        document.getElementById("name");

    const email =
        document.getElementById("email");


    // ==============================
    // ĐĂNG NHẬP GOOGLE
    // ==============================

    loginButton.addEventListener("click", async () => {

        try {

            status.textContent =
                "Đang mở Google...";

            const result =
                await signInWithPopup(auth, provider);

            console.log(
                "Đăng nhập thành công:",
                result.user
            );

            status.textContent =
                "Đăng nhập thành công!";

        } catch (error) {

            console.error(error);

            status.textContent =
                "Lỗi: " + error.message;

        }

    });


    // ==============================
    // ĐĂNG XUẤT
    // ==============================

    logoutButton.addEventListener("click", async () => {

        try {

            await signOut(auth);

            status.textContent =
                "Đã đăng xuất.";

        } catch (error) {

            console.error(error);

            status.textContent =
                "Lỗi đăng xuất: " + error.message;

        }

    });


    // ==============================
    // THEO DÕI TRẠNG THÁI LOGIN
    // ==============================

    onAuthStateChanged(auth, (user) => {

        if (user) {

            console.log("User:", user);

            loginButton.style.display = "none";

            userInfo.style.display = "block";

            avatar.src =
                user.photoURL || "";

            name.textContent =
                user.displayName || "Người dùng";

            email.textContent =
                user.email || "";

        } else {

            loginButton.style.display = "block";

            userInfo.style.display = "none";

        }

    });

</script>

</body>
</html>
